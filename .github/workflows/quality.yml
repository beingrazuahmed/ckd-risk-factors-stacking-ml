name: CKD research-code checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight validation dependencies
        run: python -m pip install pandas numpy
      - name: Notebook structure and dataset schema tests
        run: python -m unittest discover -s tests -v
      - name: Privacy and release hygiene
        run: python scripts/check_release.py
